name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: |
          casefoundry generate data/sample-prd.md --output cases.json --report coverage.json --review-db reviews.db --manifest cases.manifest.json
          python -c "import json; r=json.load(open('coverage.json')); assert r['oracles']['held_for_adjudication'] == 0"
          casefoundry regenerate data/sample-prd-v2.md --previous-manifest cases.manifest.json --output cases-v2.json --manifest cases-v2.manifest.json --audit impact-audit.json --review-db reviews-v2.db
          python -c "import json; a=json.load(open('impact-audit.json')); assert a['counts'] == {'retained': 13, 'added': 6, 'retired': 3}"

